name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-vulnerability-scan:
    name: Dependency vulnerability scan
    runs-on: [self-hosted, linux, X64, docker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36
        with:
          scan-args: |-
            --allow-no-lockfiles
            --recursive
            ./

  secret-scan:
    name: Gitleaks secret scan
    runs-on: [self-hosted, linux, X64, docker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run gitleaks
        uses: docker://zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
        with:
          args: detect --source=/github/workspace --no-git --redact --verbose --no-banner

  trufflehog-secret-scan:
    name: TruffleHog verified secret scan
    runs-on: [self-hosted, linux, X64, docker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e
        with:
          path: ./
          extra_args: --results=verified

  workflow-security:
    name: GitHub Actions workflow audit
    runs-on: [self-hosted, linux, X64, docker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e
        with:
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: medium
