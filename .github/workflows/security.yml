name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-vulnerability-scan:
    name: Dependency vulnerability scan
    runs-on: [self-hosted, linux, X64, docker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36
        with:
          scan-args: |-
            --allow-no-lockfiles
            --recursive
            ./

  secret-scan:
    name: Gitleaks secret scan
    runs-on: [self-hosted, linux, X64, docker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Nested docker:// bind-mounts resolve on the host; named-volume workspaces
      # appear empty there (prior runs scanned ~0 bytes). Run the binary in-process.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha256='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${expected_sha256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" gitleaks
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Run gitleaks
        run: gitleaks detect --source=. --no-git --redact --verbose --no-banner

  trufflehog-secret-scan:
    name: TruffleHog verified secret scan
    runs-on: [self-hosted, linux, X64, docker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Avoid nested docker (action and docker:// both mount empty host paths).
      - name: Install TruffleHog
        run: |
          set -euo pipefail
          version='3.99.7'
          archive="trufflehog_${version}_linux_amd64.tar.gz"
          expected_sha256='bdbea0508e439b144f49de14e775908de5f902f3d14ea7ae8354bae72b0b72ef'
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${version}/${archive}"
          echo "${expected_sha256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" trufflehog
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Run TruffleHog
        run: trufflehog git file://. --fail --no-update --results=verified

  workflow-security:
    name: GitHub Actions workflow audit
    runs-on: [self-hosted, linux, X64, docker]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # zizmor-action nests docker with an empty host bind on this runner.
      - name: Install zizmor
        run: |
          set -euo pipefail
          version='1.25.0'
          archive='zizmor-x86_64-unknown-linux-gnu.tar.gz'
          expected_sha256='a16853f39c9e059aed04f3f7961acb75468af67b235ae36a9faff337d61e3d24'
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${version}/${archive}"
          echo "${expected_sha256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/bin" zizmor
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          zizmor
          --persona=regular
          --format=github
          --min-severity=medium
          --min-confidence=medium
          --color=always
          --
          .
